name: AppStore

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  appstore:
    runs-on: xcode-27

    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1_beta.app/Contents/Developer
      APP_NAME: WebSocketClient
      SCHEME: Production

    permissions:
      contents: write

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Checkout ci_scripts
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: nnsnodnb/xcodebuild-ci-scripts
        path: ci_scripts

    - name: Get SwiftPM originHash
      id: get-swiftpm-origin-hash
      run: |
        ORIGIN_HASH="$(jq -c -r '.originHash' WebSocketClient.xcworkspace/xcshareddata/swiftpm/Package.resolved)"
        echo "ORIGIN_HASH=${ORIGIN_HASH}" >> "${GITHUB_OUTPUT}"

    - name: Cache Swift Packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      id: cache-swiftpm
      timeout-minutes: 20
      with:
        path: .swiftpm
        key: ${{ runner.os }}-swiftpm-${{ steps.get-swiftpm-origin-hash.outputs.ORIGIN_HASH }}

    - name: Write IDESkipPackagePluginFingerprintValidatation
      run: defaults write com.apple.dt.Xcode IDESkipPackagePluginFingerprintValidatation -bool YES

    - name: Write IDESkipMacroFingerprintValidation
      run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES

    - name: Setup AuthKey.p8
      env:
        APP_STORE_CONNECT_API_KEY_P8_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8_BASE64 }}
      run: |
        echo "${APP_STORE_CONNECT_API_KEY_P8_BASE64}" | base64 -d > /tmp/AuthKey.p8
        chmod 600 /tmp/AuthKey.p8

    - name: Xcodebuild showBuildSettings
      id: show-build-settings
      run: |
        ./ci_scripts/get_marketing_version.sh \
          "${APP_NAME}" \
          "${SCHEME}"

    - name: Build Production.ipa
      env:
        VERSION: ${{ steps.show-build-settings.outputs.marketing_version }}
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      run: |
        ./ci_scripts/create_keychain.sh
        ./ci_scripts/archive_export.sh \
          "${APP_NAME}" \
          "${SCHEME}" \
          "${VERSION}" \
          "${KEY_ID}" \
          "${ISSUER_ID}" \
          "./App/${SCHEME}/${SCHEME}/Resources/GoogleService-Info.plist"

    - name: Upload ipa to App Store Connect
      env:
        EVENT_NAME: ${{ github.event_name }}
        KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        APP_ID: "6448638174"
        VERSION: ${{ steps.show-build-settings.outputs.marketing_version }}
      run: |
        OPT_ARG=""
        if [[ "${EVENT_NAME}" = "pull_request" ]]; then
          OPT_ARG="--dry-run"
        fi
        ./ci_scripts/upload_app_store_connect.sh \
          "${APP_NAME}" \
          "${KEY_ID}" \
          "${ISSUER_ID}" \
          "${APP_ID}" \
          ./Products/Products.ipa \
          "${VERSION}" \
          "${OPT_ARG}"

    - name: Upload Products
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: websocket-client-appstore
        path: Products

    - name: Upload Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          Products/Production.ipa
          Products/Production.app.dSYM.zip
        generate_release_notes: true
        draft: true
